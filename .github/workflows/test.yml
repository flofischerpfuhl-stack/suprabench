name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: vitest (convex-test, edge-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            tests/convex/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install test deps
        working-directory: tests/convex
        run: npm ci

      - name: Run vitest suite
        working-directory: tests/convex
        run: npm test

  check-tiers:
    name: check:tiers (single source of truth)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Verify tier table consistency
        run: npm run check:tiers
